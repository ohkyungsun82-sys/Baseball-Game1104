<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 3D 야구 경기</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; overflow: hidden; }
        .card { background: #1e293b; max-width: 450px; margin: 80px auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 85%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; width: 90%; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .hidden { display: none !important; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        #canvas-container { width: 100vh; height: 65vh; margin: 0 auto; background: #1b4d3e; }

        /* 전광판 (Scoreboard) */
        .scoreboard { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); padding: 12px 25px; border-radius: 12px; border: 2px solid #f59e0b; display: flex; gap: 20px; font-weight: bold; font-size: 16px; }
        
        /* 다이아몬드 베이스 시각화 */
        .field-status { position: absolute; top: 90px; right: 20px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 10px; text-align: left; font-size: 14px; }
        .base-diamond { width: 60px; height: 60px; position: relative; margin: 5px auto; transform: rotate(45deg); border: 2px solid #fff; }
        .base { position: absolute; width: 14px; height: 14px; background: #fff; }
        #b2 { top: 0; left: 23px; }
        #b3 { top: 23px; left: 0; }
        #b1 { top: 23px; right: 0; }
        #b_home { bottom: 0; left: 23px; background: #f59e0b; }
        .active-base { background: #ef4444 !important; }

        /* 투수 컨트롤 패널 */
        #pitcher-panel { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 20px; border-radius: 12px; border: 2px solid #3b82f6; text-align: center; width: 350px; }
        
        /* 타자 타이밍 바 패널 */
        #batter-panel { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 20px; border-radius: 12px; border: 2px solid #10b981; text-align: center; width: 380px; }
        .bar-container { width: 100%; height: 25px; background: #334155; border-radius: 12px; margin: 10px 0; position: relative; overflow: hidden; }
        .sweet-spot { position: absolute; left: 42%; width: 16%; height: 100%; background: rgba(16, 185, 129, 0.7); }
        #cursor-bar { position: absolute; left: 0%; top: 0; width: 8px; height: 100%; background: #ef4444; border-radius: 4px; }

        .chat-container { position: absolute; bottom: 10px; left: 10px; width: 280px; background: rgba(15,23,42,0.9); border-radius: 8px; padding: 10px; text-align: left; border: 1px solid #334155; }
        .chat-messages { height: 70px; overflow-y: auto; font-size: 13px; margin-bottom: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="card" id="auth-screen">
        <h2>⚾ 실시간 3D 야구 경기</h2>
        <input type="text" id="username" placeholder="아이디"><br>
        <input type="password" id="password" placeholder="비밀번호"><br>
        <button onclick="login()">로그인</button>
        <button onclick="signup()" style="background: #10b981;">회원가입</button>
        <p id="auth-msg" style="color: #ef4444; margin-top: 10px;"></p>
    </div>

    <div class="card hidden" id="lobby-screen">
        <h2 id="welcome-user">환영합니다!</h2>
        <button onclick="startMatchmaking()">야구 경기 매칭 시작</button>
    </div>

    <div class="card hidden" id="waiting-screen">
        <h2>상대를 찾는 중...</h2>
        <button onclick="cancelMatch()" style="background: #ef4444;">취소</button>
    </div>

    <div class="card hidden" id="game-container" style="max-width: none; padding: 0; margin: 0;">
        <!-- 전광판 -->
        <div class="scoreboard">
            <div>이닝: <span id="inning-text">1회초</span></div>
            <div>|</div>
            <div>홈: <span id="score-p1">0</span> vs 원정: <span id="score-p2">0</span></div>
            <div>|</div>
            <div>S: <span id="count-s">0</span> B: <span id="count-b">0</span> O: <span id="count-o">0</span></div>
        </div>

        <!-- 베이스 상황 뷰어 -->
        <div class="field-status">
            <div style="text-align: center; font-size: 12px; margin-bottom: 2px;">주자 상황</div>
            <div class="base-diamond">
                <div class="base" id="b2"></div>
                <div class="base" id="b3"></div>
                <div class="base" id="b1"></div>
                <div class="base" id="b_home"></div>
            </div>
        </div>

        <div id="canvas-container"></div>

        <!-- 투수 컨트롤 박스 -->
        <div id="pitcher-panel" class="hidden">
            <h3>🥎 투수 턴: 구종을 선택하세요!</h3>
            <button onclick="pitch('fastball')" style="background: #ef4444;">직구 (빠름)</button>
            <button onclick="pitch('curveball')" style="background: #3b82f6;">커브 (느림/변화)</button>
        </div>

        <!-- 타자 컨트롤 박스 -->
        <div id="batter-panel" class="hidden">
            <h3 id="batter-msg">⚾ 타자 턴: 타이밍에 맞춰 스윙!</h3>
            <div class="bar-container">
                <div class="sweet-spot"></div>
                <div id="cursor-bar"></div>
            </div>
            <button onclick="swingBat()" style="background: #10b981;">스윙! (스페이스바)</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-box"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chat-input" placeholder="대화..." onkeypress="if(event.key==='Enter') sendChat()" style="width:75%; margin:0; padding:5px; font-size:13px;">
                <button onclick="sendChat()" style="width:25%; margin:0; padding:5px; font-size:13px;">전송</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let myRole = ''; // 'pitcher' or 'batter'
        let scene, camera, renderer, ball, batterMesh, pitcherMesh;
        let timingInterval = null;
        let cursorPosition = 0;
        let cursorSpeed = 2;

        async function signup() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/signup', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (data.success) { alert('가입 성공!'); setLoginUser(data.user); }
            else { document.getElementById('auth-msg').innerText = data.message; }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (data.success) { setLoginUser(data.user); }
            else { document.getElementById('auth-msg').innerText = data.message; }
        }

        function setLoginUser(user) {
            currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `${user.username}님 환영합니다!`;
        }

        function startMatchmaking() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            socket.emit('join_matchmaking', currentUser.username);
        }

        function cancelMatch() {
            socket.emit('cancel_matchmaking');
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        socket.on('game_start', ({ opponent, role, gameState }) => {
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            myRole = role;
            init3D();
            updateUI(gameState);
        });

        function init3D() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1b4d3e);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 1, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dir = new THREE.DirectionalLight(0xffffff, 0.6);
            dir.position.set(5, 10, 5);
            scene.add(dir);

            // 야구공
            ball = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
            ball.position.set(0, 1.5, -12);
            scene.add(ball);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // 투수 피칭
        function pitch(pitchType) {
            if (myRole !== 'pitcher') return;
            document.getElementById('pitcher-panel').classList.add('hidden');
            socket.emit('pitch_ball', { pitchType });
        }

        // 타자에게 공이 날아옴
        socket.on('incoming_pitch', ({ pitchType }) => {
            if (myRole === 'batter') {
                document.getElementById('batter-panel').classList.remove('hidden');
                cursorSpeed = pitchType === 'fastball' ? 3.5 : 2.0;
                startTimingBar();
            }
        });

        function startTimingBar() {
            cursorPosition = 0;
            let dir = 1;
            if (timingInterval) clearInterval(timingInterval);
            timingInterval = setInterval(() => {
                cursorPosition += dir * cursorSpeed;
                if (cursorPosition >= 100 || cursorPosition <= 0) dir *= -1;
                document.getElementById('cursor-bar').style.left = cursorPosition + '%';
            }, 20);
        }

        // 스윙 시도
        function swingBat() {
            if (myRole !== 'batter') return;
            clearInterval(timingInterval);
            document.getElementById('batter-panel').classList.add('hidden');

            let result = 'out';
            if (cursorPosition >= 42 && cursorPosition <= 58) {
                result = Math.random() < 0.2 ? 'homerun' : 'hit';
            } else if (cursorPosition > 30 && cursorPosition < 70) {
                result = Math.random() < 0.5 ? 'strike' : 'out';
            } else {
                result = 'strike';
            }

            socket.emit('atbat_result', { result });
        }

        // 스페이스바로도 스윙 가능
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && myRole === 'batter' && !document.getElementById('batter-panel').classList.contains('hidden')) {
                e.preventDefault();
                swingBat();
            }
        });

        // 경기 상태 업데이트
        socket.on('update_game_state', ({ gameState }) => {
            updateUI(gameState);
        });

        function updateUI(state) {
            document.getElementById('inning-text').innerText = `${state.inning}회 ${state.isTop ? '초' : '말'}`;
            const pIds = Object.keys(state.scores);
            document.getElementById('score-p1').innerText = state.scores[pIds[0]];
            document.getElementById('score-p2').innerText = state.scores[pIds[1]];
            document.getElementById('count-s').innerText = state.strikes;
            document.getElementById('count-b').innerText = state.balls;
            document.getElementById('count-o').innerText = state.outs;

            // 베이스 표시
            document.getElementById('b1').className = 'base ' + (state.bases[0] ? 'active-base' : '');
            document.getElementById('b2').className = 'base ' + (state.bases[1] ? 'active-base' : '');
            document.getElementById('b3').className = 'base ' + (state.bases[2] ? 'active-base' : '');

            // 턴 재배정 확인
            if (state.batter.id === socket.id) {
                myRole = 'batter';
                document.getElementById('pitcher-panel').classList.add('hidden');
                document.getElementById('batter-msg').innerText = "⚾ 내 차례: 투수가 공을 던지면 스윙하세요!";
            } else {
                myRole = 'pitcher';
                document.getElementById('batter-panel').classList.add('hidden');
                document.getElementById('pitcher-panel').classList.remove('hidden');
            }
        }

        socket.on('game_over', ({ scores }) => {
            alert('게임 종료! 최종 점수 확인');
            window.location.reload();
        });

        function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            socket.emit('send_chat', input.value);
            input.value = '';
        }
        socket.on('receive_chat', ({ sender, message }) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${sender}:</b> ${message}</div>`;
            box.scrollTop = box.scrollHeight;
        });
        socket.on('opponent_disconnected', () => { alert('상대방이 나갔습니다.'); window.location.reload(); });
    </script>
</body>
</html>
